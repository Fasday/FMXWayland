# Headless Xorg test display. No physical input/GPU/VT is acquired.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "DummyVideo"
    Driver "dummy"
    VideoRam 32768
EndSection
Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 28-100
    VertRefresh 40-100
    Modeline "1280x800" 83.50 1280 1352 1480 1680 800 803 809 831 -HSync +VSync
EndSection
Section "Screen"
    Identifier "VirtualScreen"
    Device "DummyVideo"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
        Virtual 1280 800
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "VirtualLayout"
    Screen "VirtualScreen"
EndSection
